<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        div.container{
        display:flex;
    }
    div.one{
        border-radius: 20px;
        border-style:solid;
    }
    div.two{
        border-style:double ;
        border-width:medium;
        border-color:black;
        border-radius:20px;
        margin: 10px;
    }
    div.three{
        border-style: groove;
        border-width: medium;
        border-top-left-radius:20px;
    }
    </style>
</head>
<body>
    <div class="container">

        <div class="one">
            <H1>hello</H1>
        </div>

        <div class="two">
                <h2>
                    hello
                </h2>
        </div>

        <div class="three">
            <h3>hello</h3>
        </div>

    </div>
</body>
</html>
