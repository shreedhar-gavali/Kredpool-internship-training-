<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.container{
    display: grid;
    grid-template-columns:50px,1fr,50fr;
    grid-template-rows:auto;
    gap: 3px;
    background-color:rgb(250, 208, 208);
    width: 1250px;
    height: 600px;
    
     
    grid-template-areas:"header header header"
                          "sidebar content ads  "
                          "footer footer  footer";
    }

    .container div{border: solid thick powderblue;
        padding: 10px;
        text-align: center;
      
    }

.container div.header{
    grid-area: header;
    text-align: center;

}
.container div.sidebar{
    grid-area:sidebar;
    text-align: center;
}
.container div.content{
    grid-area:content;
}
.container div.footer{
    grid-area:footer;
   
}
.container div.ads{
    grid-area: ads;
}

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <header><h2>Header</h2></header>
        </div>

        <div class="sidebar">
            <h3>this is sidebar</h3>
            <p>this is a para</p>
        </div>

        <div class="content">
            <h4>Content</h4>
        </div>

        <div class="ads"><h4>ads section</h4></div>

        <div class="footer">
            <footer><h2>Footer</h2></footer>
        </div>
    </div>
 
</body>
</html>
