<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="1" cellpadding="10" cellspacing="10" colspan="2" align="center" >
        <caption>caption for the table</caption>
        <thead>
            <tr>
                <th> col1</th>
                <th>col2</th>
                <th>col3</th>
            </tr>
        </thead>
        <tbody>
        <tr>
            <td>row1 col1</td>
            <td>row1 col2</td>
            <td>row1 col3</td>

        </tr>

        <tr>
            <td>row2 col1</td>
            <td>row2 col2</td>
            <td>row2 col3</td>
            
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">colspan is used here</td>
                <td>row2 col3</td>
            </tr>
            </tfoot>
            
    </table>
</body>
</html>
